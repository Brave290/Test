<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Creative</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<style>
body { background:#050505; color:white; }
.btn { background:#ff5a00; padding:10px 15px; border-radius:8px; }
</style>
</head>

<body class="p-4">

<!-- AUTH SCREEN -->
<div id="authScreen" class="flex flex-col items-center justify-center h-screen">

<h1 class="text-3xl mb-4 text-orange-500">Phantom Creative</h1>

<input id="email" placeholder="Email" class="p-2 mb-2 text-black">
<input id="password" type="password" placeholder="Password" class="p-2 mb-2 text-black">

<button onclick="signup()" class="btn mb-2">Sign Up</button>
<button onclick="login()" class="btn mb-2">Login</button>

<button onclick="resetPassword()" class="text-sm underline">
Forgot Password?
</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<h2 class="text-2xl text-orange-500 mb-4">Dashboard</h2>

<p id="userEmail"></p>

<!-- PROFILE -->
<input id="name" placeholder="Your Name" class="p-2 text-black mb-2">
<input type="file" id="profilePic">

<button onclick="saveProfile()" class="btn mb-4">Save Profile</button>

<img id="profileImage" class="w-24 h-24 rounded-full mb-4">

<!-- FILE UPLOAD -->
<input type="file" id="fileInput">
<button onclick="uploadFile()" class="btn">Upload File</button>

<ul id="files"></ul>

<!-- BLOG -->
<h3 class="mt-6 text-xl">Blog</h3>
<div id="blogPosts"></div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden mt-6">
<h3 class="text-orange-500">Admin Panel</h3>

<textarea id="postContent" class="text-black w-full"></textarea>
<button onclick="postBlog()" class="btn mt-2">Post Blog</button>

</div>

<button onclick="logout()" class="bg-red-500 mt-4 p-2">Logout</button>

</div>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCzbWS2nhqlW-Wcvitxdl_prq7Xs766QWA",
  authDomain: "phantom-creative-be7a9.firebaseapp.com",
  databaseURL: "https://phantom-creative-be7a9-default-rtdb.firebaseio.com",
  projectId: "phantom-creative-be7a9",
  storageBucket: "phantom-creative-be7a9.firebasestorage.app",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();


// SIGNUP
function signup(){
let email = emailInput();
let pass = passInput();

auth.createUserWithEmailAndPassword(email,pass)
.then(()=>{
alert("Signup successful!");
})
.catch(e=>alert(e.message));
}

// LOGIN
function login(){
let email = emailInput();
let pass = passInput();

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
showDashboard();
})
.catch(e=>alert(e.message));
}

// RESET PASSWORD
function resetPassword(){
let email = emailInput();

auth.sendPasswordResetEmail(email)
.then(()=>alert("Password reset sent to email"))
.catch(e=>alert(e.message));
}

// AUTH STATE
auth.onAuthStateChanged(user=>{
if(user){
showDashboard();
}
});

// SHOW DASHBOARD
function showDashboard(){
document.getElementById("authScreen").style.display="none";
document.getElementById("dashboard").style.display="block";

let user = auth.currentUser;

document.getElementById("userEmail").innerText=user.email;

// ADMIN CHECK
if(user.email==="legateakanjimusab@gmail.com"){
document.getElementById("adminPanel").style.display="block";
}

loadFiles();
loadBlog();
}

// SAVE PROFILE
function saveProfile(){
let name = document.getElementById("name").value;
let user = auth.currentUser;

db.ref("users/"+user.uid).set({name});
}

// FILE UPLOAD
function uploadFile(){
let file = document.getElementById("fileInput").files[0];
let user = auth.currentUser;

let ref = storage.ref("files/"+user.uid+"/"+file.name);

ref.put(file).then(()=>{
db.ref("files/"+user.uid+"/"+file.name).set({name:file.name});
loadFiles();
});
}

// LOAD FILES
function loadFiles(){
let user = auth.currentUser;

db.ref("files/"+user.uid).on("value",snap=>{
let data = snap.val()||{};
let list = Object.values(data).map(f=>`<li>${f.name}</li>`).join("");
document.getElementById("files").innerHTML=list;
});
}

// BLOG POST
function postBlog(){
let content = document.getElementById("postContent").value;

db.ref("blog").push({
content,
date:Date.now()
});
}

// LOAD BLOG
function loadBlog(){
db.ref("blog").on("value",snap=>{
let data = snap.val()||{};
let posts = Object.values(data)
.reverse()
.map(p=>`<div class="p-2 border">${p.content}</div>`).join("");

document.getElementById("blogPosts").innerHTML=posts;
});
}

// LOGOUT
function logout(){
auth.signOut();
location.reload();
}

// HELPERS
function emailInput(){ return document.getElementById("email").value; }
function passInput(){ return document.getElementById("password").value; }

</script>

</body>
</html>
