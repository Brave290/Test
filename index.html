<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phantom Creative Co.</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family:'Orbitron',sans-serif; background:#050505; color:white; }
.card { background:#0a0a0a; border:1px solid rgba(255,102,0,0.2); transition:0.3s; }
.card:hover { transform:translateY(-5px); box-shadow:0 0 20px rgba(255,102,0,0.6); }
.btn { background:linear-gradient(45deg,#ff5a00,#ff7a00); color:white; transition:0.3s; }
.btn:hover { opacity:0.9; }
.grid-bg {background-image: linear-gradient(rgba(255,102,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,102,0,0.05) 1px, transparent 1px); background-size:40px 40px;}
.toast {position:fixed; bottom:80px; right:20px; background:#ff5a00; padding:10px 15px; border-radius:6px;}
</style>
</head>

<body class="grid-bg">

<!-- NAV -->
<header class="fixed w-full flex justify-between p-4 bg-black/40 backdrop-blur z-50">
<h1 class="text-orange-500 font-bold">Phantom</h1>
<button onclick="toggleMode()">🌙</button>
</header>

<!-- HERO -->
<section class="h-screen flex flex-col justify-center items-center text-center px-6">
<h1 class="text-5xl text-orange-500 mb-4">Beyond Vision</h1>
<p class="text-gray-300 max-w-xl">Minimalism meets bold futuristic branding.</p>
<button class="btn px-4 py-2 mt-6" onclick="googleLogin()">Login with Google</button>
</section>

<!-- SERVICES -->
<section class="py-16 text-center">
<h2 class="text-3xl text-orange-500 mb-8">Services</h2>
<div class="grid md:grid-cols-3 gap-6 px-6">
<div class="card p-6 rounded">Logo Design</div>
<div class="card p-6 rounded">Business Cards</div>
<div class="card p-6 rounded">Flyers & Posters</div>
</div>
</section>

<!-- PRICING -->
<section class="py-16 text-center">
<h2 class="text-3xl text-orange-500 mb-8">Pricing</h2>

<div class="grid md:grid-cols-3 gap-6 px-6">

<div class="card p-6 rounded">
<h3>Basic</h3>
<p class="text-orange-500 text-2xl">₦7,500</p>
<button onclick="openPayment(750000)" class="btn px-4 py-2 mt-4 rounded">Choose</button>
</div>

<div class="card p-6 rounded border border-orange-500">
<h3>Pro</h3>
<p class="text-orange-500 text-2xl">₦10,500</p>
<button onclick="openPayment(1050000)" class="btn px-4 py-2 mt-4 rounded">Choose</button>
</div>

<div class="card p-6 rounded">
<h3>Advanced</h3>
<p class="text-orange-500 text-2xl">₦22,500</p>
<button onclick="openPayment(2250000)" class="btn px-4 py-2 mt-4 rounded">Choose</button>
</div>

</div>
</section>

<!-- AI GENERATOR -->
<section class="py-16 text-center">
<h2 class="text-2xl text-orange-500 mb-4">AI Logo Generator</h2>

<input id="aiInput" placeholder="Enter brand name..."
class="p-2 w-64 bg-black border border-orange-500 mb-4">

<br>

<button onclick="generateLogo()" class="btn px-4 py-2 rounded">Generate</button>

<br><br>

<textarea id="aiOutput" class="w-64 h-24 bg-black border border-gray-700"></textarea>

<br>

<button onclick="copyText()" class="btn px-3 py-1 mt-2 rounded">Copy</button>
</section>

<!-- PAYMENT MODAL -->
<div id="modal" class="fixed inset-0 hidden bg-black/80 flex items-center justify-center">
<div class="bg-black p-6 rounded border border-orange-500 text-center">

<h3 class="text-orange-500 mb-3">Enter Email</h3>

<input id="email" class="p-2 bg-gray-900 border border-gray-700 mb-4">

<br>

<button onclick="payNow()" class="btn px-4 py-2 rounded">Pay</button>

</div>
</div>

<!-- FLOAT -->
<button onclick="scrollTop()" class="fixed bottom-6 right-6 bg-orange-500 p-3 rounded">↑</button>

<a href="https://wa.me/234915118688" target="_blank"
class="fixed bottom-20 right-6 bg-green-500 px-4 py-2 rounded">
Chat
</a>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden p-6 text-center">
<h2 class="text-2xl text-orange-500 mb-4">Dashboard</h2>
<p id="userEmail" class="mb-4"></p>

<!-- FILE UPLOAD -->
<input type="file" id="fileInput" class="mb-4">
<button onclick="uploadFile()" class="btn px-4 py-2 rounded mb-4">Upload Project File</button>

<h3 class="text-orange-400 mb-2">Uploaded Files</h3>
<ul id="fileList" class="text-sm text-gray-300"></ul>

<br>

<button onclick="logout()" class="bg-red-500 px-4 py-2 rounded">Logout</button>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCzbWS2nhqlW-Wcvitxdl_prq7Xs766QWA",
  authDomain: "phantom-creative-be7a9.firebaseapp.com",
  databaseURL: "https://phantom-creative-be7a9-default-rtdb.firebaseio.com",
  projectId: "phantom-creative-be7a9",
  storageBucket: "phantom-creative-be7a9.firebasestorage.app",
  messagingSenderId: "468520974182",
  appId: "1:468520974182:web:a8b12f3a54a34deea43aa7"
};

// INIT FIREBASE
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

// GOOGLE LOGIN
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(result=>{
      showToast("Login successful!");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("userEmail").innerText = "Logged in as: "+result.user.email;
    })
    .catch(err=>showToast(err.message));
}

// LOGOUT
function logout(){
  auth.signOut().then(()=> location.reload());
}

// FILE UPLOAD
function uploadFile(){
  const file = document.getElementById("fileInput").files[0];
  if(!file){ showToast("Select file"); return; }
  const user = auth.currentUser;
  if(!user){ showToast("Login first"); return; }

  const ref = storage.ref("files/"+user.uid+"/"+file.name);
  ref.put(file).then(()=>{
    showToast("File uploaded!");
    db.ref("files/"+user.uid+"/"+file.name).set({ name:file.name, time:Date.now() });
    loadFiles();
  });
}

// LOAD FILES
function loadFiles(){
  const user = auth.currentUser;
  if(!user) return;
  db.ref("files/"+user.uid).once('value',snapshot=>{
    const files = snapshot.val()||{};
    const list = Object.keys(files).map(k=>`<li>${files[k].name}</li>`).join("");
    document.getElementById("fileList").innerHTML=list;
  });
}

// PAYSTACK PAYMENT
let amount = 0;
function openPayment(a){
  amount=a;
  document.getElementById("modal").classList.remove("hidden");
}

function payNow(){
  let email = auth.currentUser? auth.currentUser.email : document.getElementById("email").value;
  if(!email){ showToast("Enter email"); return; }

  var handler = PaystackPop.setup({
    key:'YOUR_PAYSTACK_PUBLIC_KEY',
    email:email,
    amount:amount,
    currency:"NGN",
    callback:function(res){
      showToast("Payment successful: "+res.reference);
      db.ref("payments/"+res.reference).set({ email:email, amount:amount/100, reference:res.reference, date:Date.now() });
      document.getElementById("modal").classList.add("hidden");
    },
    onClose:function(){ showToast("Payment cancelled"); }
  });
  handler.openIframe();
}

// AI GENERATOR
function generateLogo(){
  const val=document.getElementById("aiInput").value;
  document.getElementById("aiOutput").value=`Modern futuristic logo for ${val}, minimalist, bold identity`;
}

// COPY AI TEXT
function copyText(){ 
  const t=document.getElementById("aiOutput"); 
  t.select(); document.execCommand("copy"); 
  showToast("Copied");
}

// TOAST
function showToast(msg){
  const t=document.createElement("div"); t.className="toast"; t.innerText=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// DARK MODE
function toggleMode(){ document.body.classList.toggle("bg-white"); document.body.classList.toggle("text-black"); }

// SCROLL TOP
function scrollTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

</script>

</body>
</html>
