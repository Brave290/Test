<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Phantom Creative</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black">
  <div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <i class="fas fa-crown text-6xl text-orange-500 mb-6"></i>
      <h1 class="text-8xl font-black gradient-text mb-4">404</h1>
      <h2 class="text-3xl font-bold mb-4">Page Not Found</h2>
      <p class="text-gray-400 mb-8">Oops! The page you're looking for doesn't exist.</p>
      <a href="index.html" class="btn-primary">Back to Home</a>
    </div>
  </div>
  <div class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></div>
  <script>
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => { if (window.scrollY > 300) backToTop.classList.add('show'); else backToTop.classList.remove('show'); });
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>
</body>
</html>
