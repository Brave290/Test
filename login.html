<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Phantom Creative</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black">

  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <i class="fas fa-crown"></i>
        <span class="gradient-text">Phantom Creative</span>
      </a>
      <div class="navbar-menu" id="navbarMenu">
        <a href="index.html" class="navbar-link">Home</a>
        <a href="about.html" class="navbar-link">About</a>
        <a href="services.html" class="navbar-link">Services</a>
        <a href="portfolio.html" class="navbar-link">Portfolio</a>
        <a href="blog.html" class="navbar-link">Blog</a>
        <a href="contact.html" class="navbar-link">Contact</a>
      </div>
      <div class="navbar-buttons">
        <a href="signup.html" class="btn-outline" style="padding: 8px 20px;">Sign Up</a>
        <button class="navbar-toggle" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card glass-card p-8 rounded-2xl animate-fadeInUp">
      <div class="auth-header">
        <i class="fas fa-crown"></i>
        <h1 class="gradient-text">Welcome Back</h1>
        <p>Sign in to access your creative dashboard</p>
      </div>
      
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email address" class="form-input" required>
        <input type="password" id="loginPassword" placeholder="Password" class="form-input" required>
        <button type="submit" class="btn-primary w-full">Sign In <i class="fas fa-arrow-right ml-2"></i></button>
      </form>
      
      <div class="auth-footer">
        <button onclick="forgotPassword()" class="text-orange-500 text-sm hover:underline w-full text-center mb-2">Forgot Password?</button>
        <p>Don't have an account? <a href="signup.html">Create one</a></p>
      </div>
    </div>
  </div>

  <div class="support-icon" onclick="openSupport()">
    <i class="fas fa-headset"></i>
    <span class="support-tooltip">Need help? Chat with us</span>
  </div>

  <div class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    
    function showToast(message, type) { 
      const toast = document.createElement('div'); 
      toast.className = `toast-notification toast-${type}`; 
      toast.innerHTML = message; 
      document.body.appendChild(toast); 
      setTimeout(() => toast.remove(), 3000); 
    }
    
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navbarMenu = document.getElementById('navbarMenu');
    mobileMenuBtn?.addEventListener('click', () => navbarMenu.classList.toggle('active'));
    
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) backToTop.classList.add('show');
      else backToTop.classList.remove('show');
    });
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    
    window.openSupport = () => {
      window.location.href = "mailto:legateakanjimusab@gmail.com?subject=Support Request&body=Hello, I need help with...";
    };
    
    window.forgotPassword = async () => {
      const email = prompt('Enter your email address to receive a password reset link:');
      if (email) {
        try {
          await sendPasswordResetEmail(auth, email);
          showToast('Password reset email sent! Check your inbox.', 'success');
        } catch (error) { 
          showToast(error.message, 'error'); 
        }
      }
    };
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }
      
      const submitBtn = e.target.querySelector('button');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';
      submitBtn.disabled = true;
      
      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('Welcome back! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } catch (error) {
        if (error.code === 'auth/user-not-found') showToast('No account found with this email', 'error');
        else if (error.code === 'auth/wrong-password') showToast('Incorrect password', 'error');
        else showToast(error.message, 'error');
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
