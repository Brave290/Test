<script type="module">
  import { auth, ADMIN_EMAIL, db, ref, onValue, push, set, get, GOOGLE_SCRIPT_URL } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
  
  // ... rest of your blog code ...
  
  // Newsletter Signup (same as contact.html)
  document.getElementById('newsletterForm')?.addEventListener('submit', async (e) => { 
    e.preventDefault(); 
    const email = document.getElementById('newsletterEmail').value; 
    const msgDiv = document.getElementById('newsletterMsg'); 
    const subscribersRef = ref(db, 'subscribers'); 
    const snapshot = await get(subscribersRef); 
    let exists = false; 
    if (snapshot.exists()) { 
      const subscribers = snapshot.val(); 
      exists = Object.values(subscribers).some(sub => sub.email === email); 
    } 
    if (exists) { 
      msgDiv.innerHTML = 'You\'re already subscribed!'; 
      msgDiv.classList.add('text-green-300'); 
    } else { 
      const newSubRef = push(subscribersRef); 
      await set(newSubRef, { email, subscribedAt: Date.now(), status: 'active' }); 
      
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'newsletter', email: email })
      });
      
      msgDiv.innerHTML = '🎉 Subscribed successfully! Check your email for a welcome message!'; 
      msgDiv.classList.add('text-green-300'); 
      document.getElementById('newsletterEmail').value = ''; 
    } 
    setTimeout(() => { msgDiv.innerHTML = ''; }, 5000); 
  });
</script>
